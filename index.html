
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DATABASE RETURN SCANNER</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 15px;
      background: #f1f5f9;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 480px;
      margin: 20px auto;
      padding: 20px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 3px 12px #00000015;
    }

    h2 {
      text-align: center;
      color: #166534;
    }

    p {
      text-align: center;
      color: #475569;
    }

    #reader {
      width: 100%;
      margin: 20px auto;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 12px;
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
    }

    .green { background: #16a34a; }
    .red { background: #dc2626; }
    .blue { background: #2563eb; }

    input {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 17px;
    }

    label {
      display: block;
      margin-top: 18px;
      font-weight: bold;
    }

    #message {
      padding: 12px;
      margin-top: 15px;
      border-radius: 8px;
      text-align: center;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .info {
      background: #e0f2fe;
      color: #075985;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }
  </style>
</head>

<body>

<div class="container">

  <h2>DATABASE RETURN</h2>
  <p>BARCODE SCANNER</p>

  <div id="reader"></div>

  <button class="green" id="startButton" onclick="startScan()">
    MULAI SCAN
  </button>

  <button class="red" id="stopButton" onclick="stopScan()">
    STOP KAMERA
  </button>

  <label>Nomor Resi</label>

  <input
    type="text"
    id="resi"
    placeholder="Nomor resi akan muncul di sini"
  >

  <button class="blue" onclick="copyResi()">
    SALIN NOMOR RESI
  </button>

  <button
    class="blue"
    id="sendButton"
    onclick="sendToForm()"
    style="display:none"
  >
    KIRIM KE FORM DATABASE
  </button>

  <div id="message" class="info">
    Tekan MULAI SCAN untuk membuka kamera.
  </div>

</div>

<script>
  let scanner = null;
  let active = false;
  let processing = false;

  function showMessage(text, type = 'info') {
    const el = document.getElementById('message');
    el.textContent = text;
    el.className = type;
  }

  async function startScan() {
    if (active) return;

    const button = document.getElementById('startButton');

    try {
      button.disabled = true;
      showMessage('Mencari kamera HP...', 'info');

      if (!window.isSecureContext) {
        throw new Error('Buka scanner melalui HTTPS GitHub Pages.');
      }

      if (!navigator.mediaDevices ||
          !navigator.mediaDevices.getUserMedia) {
        throw new Error('Browser tidak mendukung kamera. Gunakan Chrome.');
      }

      if (typeof Html5Qrcode === 'undefined') {
        throw new Error('Library scanner gagal dimuat. Periksa internet.');
      }

      scanner = new Html5Qrcode('reader');
      processing = false;

      // Mendeteksi kamera yang tersedia
      const cameras = await Html5Qrcode.getCameras();

      if (!cameras || cameras.length === 0) {
        throw new Error('Kamera tidak ditemukan pada HP.');
      }

      // Memilih kamera belakang jika tersedia
      const backCamera = cameras.find(camera =>
        /back|rear|environment|belakang/i.test(camera.label)
      );

      const selectedCamera = backCamera || cameras[cameras.length - 1];

      showMessage(
        'Mengaktifkan kamera: ' + selectedCamera.label,
        'info'
      );

      await scanner.start(
        selectedCamera.id,
        {
          fps: 10,
          qrbox: function(width, height) {
            return {
              width: Math.min(width * 0.85, 300),
              height: Math.min(height * 0.35, 150)
            };
          }
        },
        async function(decodedText) {
          if (processing) return;

          processing = true;

          document.getElementById('resi').value = decodedText;
          document.getElementById('sendButton').style.display = 'block';

          showMessage(
            'BARCODE BERHASIL DIBACA!\n' + decodedText,
            'success'
          );

          await stopScan();
        },
        function(errorMessage) {
          // Mengabaikan barcode yang belum terbaca.
        }
      );

      active = true;
      showMessage('Kamera aktif. Arahkan ke barcode.', 'success');

    } catch (error) {
      console.error(error);

      active = false;
      button.disabled = false;

      if (scanner) {
        try {
          await scanner.clear();
        } catch (e) {
          console.error(e);
        }
        scanner = null;
      }

      showMessage(
        'KAMERA GAGAL DIBUKA:\n' +
        (error.message || String(error)),
        'error'
      );
    }
  }

  async function stopScan() {
    if (scanner && active) {
      try {
        await scanner.stop();
        active = false;
      } catch (error) {
        console.error(error);
      }
    }

    document.getElementById('startButton').disabled = false;
  }

  async function copyResi() {
    const resi = document.getElementById('resi').value.trim();

    if (!resi) {
      showMessage('Nomor resi belum tersedia.', 'error');
      return;
    }

    try {
      await navigator.clipboard.writeText(resi);
      showMessage('Nomor resi berhasil disalin.', 'success');
    } catch (error) {
      const input = document.getElementById('resi');
      input.select();
      showMessage('Silakan salin nomor resi secara manual.', 'info');
    }
  }

  function sendToForm() {
    const resi = document.getElementById('resi').value.trim();

    if (!resi) {
      showMessage('Nomor resi belum tersedia.', 'error');
      return;
    }

    if (!window.opener || window.opener.closed) {
      showMessage(
        'Halaman DATABASE RETURN tidak ditemukan. Buka scanner dari tombol SCAN BARCODE.',
        'error'
      );
      return;
    }

    window.opener.postMessage(
      {
        type: 'BARCODE_SCANNED',
        resi: resi
      },
      'https://script.google.com'
    );

    showMessage(
      'Nomor resi berhasil dikirim ke DATABASE RETURN.',
      'success'
    );

    setTimeout(function() {
      window.close();
    }, 1000);
  }
</script>

</body>
</html>
