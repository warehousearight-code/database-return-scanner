
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DATABASE RETURN SCANNER</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 15px;
      background: #f1f5f9;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 480px;
      margin: 20px auto;
      padding: 20px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 3px 12px #00000015;
    }

    h2 {
      text-align: center;
      color: #166534;
    }

    p {
      text-align: center;
      color: #475569;
    }

    #reader {
      width: 100%;
      margin: 20px auto;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 17px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 12px;
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled { opacity: 0.5; }

    .green { background: #16a34a; }
    .blue { background: #2563eb; }
    .red { background: #dc2626; }

    #message {
      padding: 12px;
      margin-top: 15px;
      border-radius: 8px;
      text-align: center;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .info {
      background: #e0f2fe;
      color: #075985;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    label {
      display: block;
      margin-top: 18px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="container">

  <h2>DATABASE RETURN</h2>
  <p>BARCODE SCANNER</p>

  <div id="reader"></div>

  <label>Nomor Resi</label>

  <input
    type="text"
    id="resi"
    placeholder="Nomor resi akan muncul di sini"
  >

  <button class="blue" onclick="copyResi()">
    SALIN NOMOR RESI
  </button>

  <button
    class="green"
    id="sendButton"
    onclick="sendToForm()"
    style="display:none"
  >
    KIRIM KE FORM DATABASE
  </button>

  <button class="red" onclick="resetScanner()">
    SCAN ULANG
  </button>

  <div id="message" class="info">
    Pilih kamera belakang, lalu tekan Start Scanning.
  </div>

</div>

<script>
  let scanner = null;
  let scanResult = false;

  function showMessage(text, type = 'info') {
    const el = document.getElementById('message');
    el.textContent = text;
    el.className = type;
  }

  function startScanner() {
    if (typeof Html5QrcodeScanner === 'undefined') {
      showMessage(
        'Library scanner tidak berhasil dimuat. Periksa internet.',
        'error'
      );
      return;
    }

    const formats = [
      Html5QrcodeSupportedFormats.CODE_128,
      Html5QrcodeSupportedFormats.CODE_39,
      Html5QrcodeSupportedFormats.CODE_93,
      Html5QrcodeSupportedFormats.EAN_13,
      Html5QrcodeSupportedFormats.EAN_8,
      Html5QrcodeSupportedFormats.ITF,
      Html5QrcodeSupportedFormats.UPC_A,
      Html5QrcodeSupportedFormats.UPC_E,
      Html5QrcodeSupportedFormats.CODABAR
    ];

    scanner = new Html5QrcodeScanner(
      'reader',
      {
        fps: 10,
        qrbox: {
          width: 280,
          height: 120
        },
        aspectRatio: 1.5,
        formatsToSupport: formats,
        rememberLastUsedCamera: true,
        supportedScanTypes: [
          Html5QrcodeScanType.SCAN_TYPE_CAMERA
        ]
      },
      false
    );

    scanner.render(
      function(decodedText) {
        if (scanResult) return;

        scanResult = true;

        document.getElementById('resi').value = decodedText;
        document.getElementById('sendButton').style.display = 'block';

        showMessage(
          'BARCODE BERHASIL DIBACA!\n' + decodedText,
          'success'
        );

        scanner.clear().catch(function(error) {
          console.error(error);
        });
      },

      function(errorMessage) {
        // Mengabaikan barcode yang belum terbaca.
      }
    );
  }

  async function copyResi() {
    const resi = document.getElementById('resi').value.trim();

    if (!resi) {
      showMessage('Nomor resi belum tersedia.', 'error');
      return;
    }

    try {
      await navigator.clipboard.writeText(resi);
      showMessage('Nomor resi berhasil disalin.', 'success');
    } catch (error) {
      const input = document.getElementById('resi');
      input.select();
      showMessage('Silakan salin nomor resi secara manual.', 'info');
    }
  }

  function sendToForm() {
    const resi = document.getElementById('resi').value.trim();

    if (!resi) {
      showMessage('Nomor resi belum tersedia.', 'error');
      return;
    }

    if (!window.opener || window.opener.closed) {
      showMessage(
        'DATABASE RETURN tidak ditemukan. Buka scanner dari tombol SCAN BARCODE.',
        'error'
      );
      return;
    }

    window.opener.postMessage(
      {
        type: 'BARCODE_SCANNED',
        resi: resi
      },
      '*'
    );

    showMessage(
      'Nomor resi berhasil dikirim ke DATABASE RETURN.',
      'success'
    );

    setTimeout(function() {
      window.close();
    }, 1000);
  }

  function resetScanner() {
    if (scanner) {
      scanner.clear().catch(function(error) {
        console.error(error);
      });
    }

    scanner = null;
    scanResult = false;

    document.getElementById('resi').value = '';
    document.getElementById('sendButton').style.display = 'none';
    document.getElementById('reader').innerHTML = '';

    showMessage('Scanner siap digunakan kembali.', 'info');

    startScanner();
  }

  window.addEventListener('load', function() {
    if (!window.isSecureContext) {
      showMessage('Gunakan halaman HTTPS untuk membuka kamera.', 'error');
      return;
    }

    startScanner();
  });
</script>

</body>
</html>
