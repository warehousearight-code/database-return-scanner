
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DATABASE RETURN SCANNER</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 3px 12px #0002;
    }

    h2 {
      text-align: center;
      color: #163b63;
    }

    #reader {
      width: 100%;
      margin-top: 15px;
    }

    #hasil {
      margin-top: 18px;
      padding: 12px;
      background: #f1f5f9;
      border-radius: 8px;
      word-break: break-all;
      text-align: center;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 14px;
      border: 0;
      border-radius: 8px;
      color: white;
      background: #16834a;
      font-size: 16px;
      font-weight: bold;
    }

    button:disabled {
      background: #94a3b8;
    }

    #status {
      text-align: center;
      margin-top: 12px;
      color: #475569;
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>DATABASE RETURN</h2>
    <h3 style="text-align:center">BARCODE SCANNER</h3>

    <div id="reader"></div>

    <div id="status">Menyiapkan kamera...</div>

    <div id="hasil">
      Hasil barcode akan muncul di sini
    </div>

    <button id="kirim" disabled onclick="kirimKeForm()">
      KIRIM KE FORM DATABASE
    </button>

    <button onclick="mulaiUlang()" style="background:#64748b">
      SCAN ULANG
    </button>
  </div>

  <script>
    let scanner = null;
    let hasilBarcode = '';
    let sudahScan = false;

    const formats = [
      Html5QrcodeSupportedFormats.CODE_128,
      Html5QrcodeSupportedFormats.CODE_39,
      Html5QrcodeSupportedFormats.CODE_93,
      Html5QrcodeSupportedFormats.EAN_13,
      Html5QrcodeSupportedFormats.EAN_8,
      Html5QrcodeSupportedFormats.ITF,
      Html5QrcodeSupportedFormats.UPC_A,
      Html5QrcodeSupportedFormats.UPC_E,
      Html5QrcodeSupportedFormats.CODABAR
    ];

    function mulaiScanner() {
      scanner = new Html5QrcodeScanner(
        'reader',
        {
          fps: 10,
          qrbox: { width: 300, height: 120 },
          aspectRatio: 1.5,
          formatsToSupport: formats,
          rememberLastUsedCamera: true
        },
        false
      );

      scanner.render(berhasilScan, gagalScan);

      document.getElementById('status').textContent =
        'Pilih kamera belakang, lalu tekan Start Scanning.';
    }

    function berhasilScan(decodedText) {
      if (sudahScan) return;

      sudahScan = true;
      hasilBarcode = decodedText;

      document.getElementById('hasil').textContent =
        'BARCODE: ' + decodedText;

      document.getElementById('status').textContent =
        'Barcode berhasil dibaca!';

      document.getElementById('kirim').disabled = false;

      scanner.clear().catch(function() {});
    }

    function gagalScan(error) {
      // Barcode belum terbaca; kamera tetap berjalan.
    }

    function kirimKeForm() {
      if (!hasilBarcode) return;

      if (!window.opener || window.opener.closed) {
        alert('Form DATABASE RETURN tidak ditemukan. Buka scanner dari tombol SCAN BARCODE di aplikasi.');
        return;
      }

      window.opener.postMessage(
        {
          type: 'BARCODE_SCANNED',
          resi: hasilBarcode
        },
        '*'
      );

      document.getElementById('status').textContent =
        'Barcode dikirim ke form DATABASE RETURN.';

      document.getElementById('kirim').disabled = true;
    }

    function mulaiUlang() {
      location.reload();
    }

    window.addEventListener('load', mulaiScanner);
  </script>
</body>
</html>
